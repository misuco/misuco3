name: Android Build

on:
  push:
    branches:
      - main
      # push a branch named ci/... to try a change without opening a pull request
      - 'ci/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tool versions belong together, see
  # https://doc.qt.io/qt-6.11/android-configure-dev-environment.html
  # android/build.gradle is the template of the same Qt version.
  QT_VERSION: '6.11.3'
  QT_ARCH: 'android_arm64_v8a'
  AQT_VERSION: '3.3.0'
  JDK_VERSION: '21'
  NDK_VERSION: '27.2.12479018'
  SDK_PLATFORM: 'android-36'
  SDK_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    # fluidsynth only needs gcem, not its test data and optional modules
    - name: Fetch gcem
      run: git -C fluidsynth submodule update --init --depth 1 gcem

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JDK_VERSION }}

    - name: Set up Android SDK and NDK
      run: |
        SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" "platform-tools" "platforms;$SDK_PLATFORM" "build-tools;$SDK_BUILD_TOOLS" "ndk;$NDK_VERSION"

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Restore cached Qt
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/Qt
        key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-multimedia

    # --autodesktop also installs the desktop Qt, its tools run during the build
    - name: Install Qt
      if: steps.cache-qt.outputs.cache-hit != 'true'
      run: |
        python3 -m venv "$RUNNER_TEMP/aqt"
        "$RUNNER_TEMP/aqt/bin/pip" install "aqtinstall==$AQT_VERSION"
        "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux android "$QT_VERSION" "$QT_ARCH" \
          -m qtmultimedia --autodesktop -O "$RUNNER_TEMP/Qt"

    - name: Configure
      run: |
        chmod +x "$RUNNER_TEMP/Qt/$QT_VERSION/$QT_ARCH/bin/qt-cmake"
        "$RUNNER_TEMP/Qt/$QT_VERSION/$QT_ARCH/bin/qt-cmake" -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DQT_HOST_PATH="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" \
          -DANDROID_SDK_ROOT="$ANDROID_HOME" \
          -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"

    - name: Build APK
      run: cmake --build build --target apk

    # The release apk is unsigned and could not be installed. It is signed
    # with a key made for this run only: good enough to try the build on a
    # device (uninstall a build of another run first), not for the store.
    - name: Sign APK for testing
      run: |
        keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -storepass android -keypass android \
          -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=misuco3 ci build"
        "$ANDROID_HOME/build-tools/$SDK_BUILD_TOOLS/apksigner" sign \
          --ks "$RUNNER_TEMP/ci.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias ci \
          --out MISUCO3-arm64-v8a.apk \
          build/android-build/build/outputs/apk/release/android-build-release-unsigned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MISUCO3-android-arm64-v8a
        path: MISUCO3-arm64-v8a.apk
        if-no-files-found: error

    # The app bundle is what the play store takes. It is uploaded unsigned,
    # the upload key stays with the publisher: sign it with jarsigner.
    - name: Build AAB
      run: |
        cmake --build build --target aab
        cp build/android-build/build/outputs/bundle/release/android-build-release.aab MISUCO3-unsigned.aab

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: MISUCO3-android-aab-unsigned
        path: MISUCO3-unsigned.aab
        if-no-files-found: error
